<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Exemplo Flex</title>
    </head>
    <body>
        <div class="flex-container">
            <header>
                <p>Cabeçalho</p>
            </header>
            
            <nav class="nav-primary">
                <p>Menu</p>
            </nav>
            
            <main>
                <nav class="nav-second">
                    <p>Submenu</p>
                </nav>
                
                <section>
                    <p>Seção</p>
                </section>

                <aside>
                    <p>Ao lado</p>
                </aside>
            </main>

            <footer>
                <p>Rodapé</p>
            </footer>
        </div>        
    </body>
</html>
