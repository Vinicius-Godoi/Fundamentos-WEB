<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilo.css">
        <title>Exemplo CSSGrid</title>
    </head>
    <body>
        <div class="grid-container">
            <header>
                <nav>
                    <h1>Header</h1>
                    <span>Área de cabeçalho</span>
                </nav>
                <img src="img/imagem-teste.jpg" alt="Imagem">
            </header>
            <main>
                <p id="p1">Main 1</p>
                <p id="p2">Main 2</p>
            </main>
            <aside>
                <p>Aside</p>
            </aside>
            <footer>
                <p>Footer</p>
            </footer>
        </div>    
    </body>
</html>
