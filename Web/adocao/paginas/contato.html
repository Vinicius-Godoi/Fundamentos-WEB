        <title>Contato</title>

        <header>
                <nav>
                    <a class="logo" href="../index.html">
                        <img class="logo-icon" src="../imagens/patas.svg"> História de Amor

<li>

                        </li>
                    </ul>
                </nav>
        </header>

        <main>
            <!--Formulário para Contato-->
            <form>
                <!--Nome-->
                <div>
                    <label>Nome Completo</label><br>
                    <input type="text" placeholder="Digite seu nome completo" required>
                </div>

                <!--E-mail-->
                <div>
                    <label>E-mail</label><br>
                    <input type="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <!--Assunto-->
                <div>
                    <label>Assunto</label><br>
                    <select>
                        <option>-</option>
                        <option>Quero adotar</option>
                        <option>Quero ser voluntário</option>
                        <option>Quero fazer uma doação</option>
                        <option>Outros</option>
                    </select>
                </div>

                <!--Menssagem-->
                <div>
                    <label>Mensagem</label><br>
                    <textarea placeholder="Digite sua mensagem..."></textarea>
                </div>

                <input type="submit" value="Enviar">
            </form>
        </main>

        <footer>

            </p>
        </footer>
