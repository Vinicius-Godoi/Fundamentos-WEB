<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Primeiro Javascript</title>
</head>
<body>
    <h1>Bem-vindo(a) ao mundo javascript</h1>
    <button id = "b1" onClick = "mudar_tema()">
        Tema Claro
    </button>
<script>
     function mudar_tema()
     {
         var botao = document.getElementById("b1");
         var cor_fundo = getComputedStyle(document.body).backgroundColor;
         //alert(cor_fundo)
         
         if(cor_fundo === 'rgb(255, 255, 255)')
         {
             alert("entrei na condição verdadeira if")
             //mudar para o tema escuro
             document.body.style.backgroundColor = "black";
             document.body.style.color = "white";
             botao.style = "background-color:white;color:black;"
             botao.textContent = "Tema Escuro";
         }
         else
         {
            alert("entrei na condição falsa if")
            console.log("entrei na condição falsa if")
             //mudar para o claro
             document.body.style.backgroundColor = "white"
             document.body.style.color = "black"
             botao.style = "background-color:black;color:white;"
             botao.textContent = "Tema Claro";
        }
         
     }   
</script>
</body>
</html>
